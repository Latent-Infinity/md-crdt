[package]
name = "md-crdt-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
md-crdt = { path = ".." }
postcard = { version = "1", features = ["alloc"] }

[workspace]

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"

[[bin]]
name = "apply_changes"
path = "fuzz_targets/apply_changes.rs"

[[bin]]
name = "decode_changes"
path = "fuzz_targets/decode_changes.rs"

[[bin]]
name = "merge_convergence"
path = "fuzz_targets/merge_convergence.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
rc_buffer = "warn"
