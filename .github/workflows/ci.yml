name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Pinned, not `stable`: lint sets and diagnostics change across releases, so
    # a blocking gate on a moving compiler is not reproducible (RPS-289). The
    # version is read from rust-toolchain.toml so there is one source of truth.
    - name: Read pinned Rust toolchain
      id: rust-toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Check formatting
      run: just fmt

    - name: Lint code
      run: just lint

    - name: Run tests
      env:
        PROPTEST_CASES: 100000
      run: just test

    - name: Differential tests
      run: just differential-test

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95.0"

    - name: Test against the declared MSRV
      run: cargo +1.95.0 test --workspace --locked

  nightly-differential-test:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nightly-
          ${{ runner.os }}-cargo-

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Differential tests (nightly)
      env:
        PROPTEST_CASES: 1000000
      run: just differential-test

    - name: Run tests (nightly)
      env:
        PROPTEST_CASES: 1000000
      run: just test

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags: ["--no-default-features", "--no-default-features --features storage", "--no-default-features --features filesync", "", "--features sequence_incremental", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: cargo +1.99.0 clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings
      - run: cargo +1.99.0 test --locked ${{ matrix.flags }}

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 test --workspace --release --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 install cargo-deny --version 0.19.1 --locked
      - run: cargo +1.99.0 deny check licenses advisories

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [parser, apply_changes, decode_changes, merge_convergence, decode_binary_wire]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - run: cargo +nightly-2026-10-01 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-10-01 fuzz run ${{ matrix.target }} -- -max_total_time=120 -max_len=65536 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  beta-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install beta --profile minimal
      - run: cargo +beta test --workspace --release --locked
