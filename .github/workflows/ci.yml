name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Pinned, not `stable`: lint sets and diagnostics change across releases, so
    # a blocking gate on a moving compiler is not reproducible (RPS-289). The
    # version is read from rust-toolchain.toml so there is one source of truth.
    - name: Read pinned Rust toolchain
      id: rust-toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
        test -n "$channel"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Check formatting
      run: just fmt

    - name: Lint code
      run: just lint

    - name: Run tests
      env:
        PROPTEST_CASES: 100000
      run: just test

    - name: Differential tests
      run: just differential-test

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The declared floor must be built, or it is a claim rather than a contract
    # (RPS-004). Checking rather than testing keeps this job cheap; the pinned
    # job above is what proves behaviour.
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95.0"

    - name: Check against the declared MSRV
      run: cargo check --workspace --all-targets

  nightly-differential-test:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nightly-
          ${{ runner.os }}-cargo-

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Differential tests (nightly)
      env:
        PROPTEST_CASES: 1000000
      run: just differential-test

    - name: Run tests (nightly)
      env:
        PROPTEST_CASES: 1000000
      run: just test
