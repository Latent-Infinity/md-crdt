[package]
name = "md-crdt-yrs-bench"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/latenty-infinity/md-crdt"
description = "Controlled md-crdt versus Yrs competitive benchmarks (unpublished)"
publish = false

[workspace]
resolver = "2"

# `cargo bench` would otherwise also run the library's default libtest harness,
# which rejects Criterion's flags (`--save-baseline`) and fails the whole run.
# The measurements live in the `compare` bench target, not in the lib.
[lib]
bench = false

[dependencies]
md-crdt = { version = "0.4.0", path = "..", default-features = false }
yrs = { version = "=0.27.3", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[features]
default = []
# Opt-in sub-probes: enable product `perf_trace` and compile attribution helpers.
# Not used by the competitive Criterion suite; never ratioed against Yrs.
sub_probes = ["md-crdt/perf_trace"]

[dev-dependencies]
criterion = "=0.5.1"

[[bench]]
name = "compare"
harness = false

[[example]]
name = "sub_probes"
required-features = ["sub_probes"]

[profile.bench]
debug = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
rc_buffer = "warn"
