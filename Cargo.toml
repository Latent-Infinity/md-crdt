[package]
name = "md-crdt"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/latenty-infinity/md-crdt"
description = "Conflict-free replicated data types for collaborative markdown editing"
readme = "README.md"
keywords = ["crdt", "collaborative", "markdown", "sync", "offline-first"]
categories = ["data-structures", "text-processing", "algorithms"]
publish = ["crates-io"]

[workspace]
members = [
    "md-crdt-ci",
    "md-crdt-ffi",
    "md-crdt-naive-oracle",
]
exclude = ["md-crdt-yrs-bench"]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
large_enum_variant = "warn"
large_stack_arrays = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
unused_async = "warn"
rc_buffer = "warn"

[lints]
workspace = true

[[bin]]
name = "md-crdt"
path = "src/bin/md-crdt.rs"
required-features = ["filesync"]

[dependencies]
# Core dependencies
serde = { version = "1.0.228", features = ["derive", "rc"] }
clap = { version = "4.5.56", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
unicode-segmentation = "1.12.0"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
miniz_oxide = "0.8.9"
rapidhash = { version = "4.5", default-features = false }

# Optional dependencies for storage feature
rkyv = { version = "0.8.17", optional = true }
crc32fast = { version = "1.5.0", optional = true }

# Optional dependencies for filesync feature
walkdir = { version = "2.5.0", optional = true }
tracing = { version = "0.1", optional = true }

# Optional dependency for heap profiling
dhat = { version = "0.3.3", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
md-crdt-naive-oracle = { path = "md-crdt-naive-oracle" }
proptest = "1.9.0"
criterion = "0.5.1"
assert_cmd = "2.1.2"
predicates = "3.1.3"
serde_json = "1.0.149"
tempfile = "3.24.0"

[features]
default = ["storage", "filesync"]
storage = ["dep:rkyv", "dep:crc32fast"]
filesync = ["storage", "dep:walkdir", "dep:tracing"]
dhat-heap = ["dhat"]
sequence_incremental = []
# Opt-in atomic hot-path counters (zero cost when off; no extra dependencies).
perf_trace = []

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3              # Maximum optimizations
lto = "fat"                # Full cross-crate LTO
codegen-units = 1          # Single codegen unit for maximum optimization
panic = "abort"            # Abort on panic (no unwinding overhead)
strip = true               # Strip symbols from binary

[profile.bench]
debug = true               # Enable debug info for profiling
